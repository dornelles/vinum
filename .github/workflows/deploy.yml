name: Test SSH Deploy

on:
  push:
    branches:
      - staging

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/github_action_deploy
          chmod 600 ~/.ssh/github_action_deploy

          ssh-keygen -y -f ~/.ssh/github_action_deploy > ~/.ssh/github_action_deploy.pub

          echo "Fingerprint:"
          ssh-keygen -lf ~/.ssh/github_action_deploy.pub

      - name: Add VPS to known hosts
        shell: bash
        run: |
          ssh-keyscan -H 179.198.119.41 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH
        shell: bash
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -i ~/.ssh/github_action_deploy \
            deployer@179.198.119.41 \
            '
              echo "SSH OK"
              whoami
              hostname
              cd /opt/apps/vinum/staging
              pwd
              git branch --show-current
              docker ps --format "table {{.Names}}\t{{.Status}}"
            '
