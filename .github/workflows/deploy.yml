name: Test SSH Deploy

on:
  push:
    branches:
      - staging

jobs:
  test-ssh:
    name: Test SSH connection
    runs-on: ubuntu-latest

    steps:
      - name: Validate secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "Validando secrets..."

          test -n "$VPS_HOST" || {
            echo "ERRO: VPS_HOST está vazio"
            exit 1
          }

          test -n "$VPS_USER" || {
            echo "ERRO: VPS_USER está vazio"
            exit 1
          }

          test -n "$VPS_PORT" || {
            echo "ERRO: VPS_PORT está vazio"
            exit 1
          }

          test -n "$VPS_SSH_KEY" || {
            echo "ERRO: VPS_SSH_KEY está vazio"
            exit 1
          }

          echo "Secrets carregados corretamente."
          echo "VPS_USER: $VPS_USER"
          echo "VPS_PORT: $VPS_PORT"

          echo "Primeira linha da chave:"
          echo "$VPS_SSH_KEY" | head -n 1

          echo "Última linha da chave:"
          echo "$VPS_SSH_KEY" | tail -n 1

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "========================================"
            echo "SSH CONNECTION SUCCESSFUL"
            echo "========================================"

            echo "User:"
            whoami

            echo "Hostname:"
            hostname

            echo "Current directory:"
            pwd

            echo "Testing staging directory..."
            cd /opt/apps/vinum/staging

            echo "Directory:"
            pwd

            echo "Git branch:"
            git branch --show-current

            echo "Git status:"
            git status --short --branch

            echo "Docker access:"
            docker ps --format "table {{.Names}}\t{{.Status}}"

            echo "========================================"
            echo "TEST COMPLETED SUCCESSFULLY"
            echo "========================================"
